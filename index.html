/* Анимация работает только на устройствах с мышью и настоящим наведением */
@media (hover: hover) and (pointer: fine) {

    .logo-subtitle a {
        position: relative;
        display: inline-block;
        padding-bottom: 5px;
    }

    .logo-subtitle a::before {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 0;
        height: 1px;
        background: currentColor;
        opacity: 0.9;
        transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .logo-subtitle a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -3px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ffd86b;
        opacity: 0;
        transform: translateX(-50%) scale(0.4);
        box-shadow:
            0 0 4px #ffd86b,
            0 0 8px #ffd86b,
            0 0 14px #ffca3a,
            0 0 20px rgba(255, 202, 58, 0.65);
        transition:
            left 0.8s cubic-bezier(0.22, 1, 0.36, 1),
            opacity 0.18s ease,
            transform 0.18s ease;
    }

    .logo-subtitle a:hover::before {
        width: 100%;
    }

    .logo-subtitle a:hover::after {
        left: 100%;
        opacity: 1;
        transform: translateX(-50%) scale(1);
        animation: magic-fade 0.8s forwards;
    }
}

@keyframes magic-fade {
    0% {
        opacity: 0;
        transform: translateX(-50%) scale(0.4);
    }

    15% {
        opacity: 1;
        transform: translateX(-50%) scale(1);
    }

    75% {
        opacity: 1;
        transform: translateX(-50%) scale(1);
    }

    100% {
        opacity: 0;
        transform: translateX(-50%) scale(0.4);
    }
}
