<!-- ABARA Website Analytics -->
<script>
(function () {
    "use strict";

    const START_ENDPOINT =
        "/website/session/start";

    const HEARTBEAT_ENDPOINT =
        "/website/session/heartbeat";

    const END_ENDPOINT =
        "/website/session/end";

    const HEARTBEAT_INTERVAL_MS =
        15000;

    let sessionId =
        null;

    let heartbeatTimer =
        null;

    let activeSince =
        null;

    let unsentActiveSeconds =
        0;

    let sessionEnded =
        false;

    function nowMs() {
        return Date.now();
    }

    function isPageActive() {
        return (
            document.visibilityState === "visible" &&
            document.hasFocus()
        );
    }

    function startActiveClock() {
        if (
            activeSince !== null ||
            !isPageActive() ||
            sessionEnded
        ) {
            return;
        }

        activeSince =
            nowMs();
    }

    function stopActiveClock() {
        if (
            activeSince === null
        ) {
            return;
        }

        const elapsedMs =
            Math.max(
                0,
                nowMs() - activeSince
            );

        unsentActiveSeconds +=
            Math.floor(
                elapsedMs / 1000
            );

        activeSince =
            null;
    }

    function collectActiveSeconds() {
        stopActiveClock();

        const seconds =
            unsentActiveSeconds;

        unsentActiveSeconds =
            0;

        if (isPageActive()) {
            startActiveClock();
        }

        return seconds;
    }

    async function postJson(
        endpoint,
        payload,
        keepalive = false
    ) {
        return fetch(
            endpoint,
            {
                method: "POST",

                credentials:
                    "include",

                keepalive,

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );
    }

    async function startSession() {
        try {
            const response =
                await postJson(
                    START_ENDPOINT,
                    {
                        pagePath:
                            window.location.pathname +
                            window.location.search,

                        documentReferrer:
                            document.referrer || null
                    }
                );

            if (!response.ok) {
                console.error(
                    "ABARA start request failed:",
                    response.status
                );

                return;
            }

            const result =
                await response.json();

            if (
                !result ||
                !result.session ||
                !result.session.id
            ) {
                console.error(
                    "ABARA start response missing session id"
                );

                return;
            }

            sessionId =
                result.session.id;

            startActiveClock();

            heartbeatTimer =
                window.setInterval(
                    sendHeartbeat,
                    HEARTBEAT_INTERVAL_MS
                );
        } catch (error) {
            console.error(
                "ABARA start error:",
                error
            );
        }
    }

    async function sendHeartbeat() {
        if (
            sessionId === null ||
            sessionEnded
        ) {
            return;
        }

        const activeSeconds =
            collectActiveSeconds();

        if (
            activeSeconds <= 0
        ) {
            return;
        }

        try {
            const response =
                await postJson(
                    HEARTBEAT_ENDPOINT,
                    {
                        sessionId,
                        activeSeconds
                    }
                );

            if (!response.ok) {
                unsentActiveSeconds +=
                    activeSeconds;

                console.error(
                    "ABARA heartbeat failed:",
                    response.status
                );
            }
        } catch (error) {
            unsentActiveSeconds +=
                activeSeconds;

            console.error(
                "ABARA heartbeat error:",
                error
            );
        }
    }

    function endSession() {
        if (
            sessionId === null ||
            sessionEnded
        ) {
            return;
        }

        sessionEnded =
            true;

        if (
            heartbeatTimer !== null
        ) {
            clearInterval(
                heartbeatTimer
            );

            heartbeatTimer =
                null;
        }

        const activeSeconds =
            collectActiveSeconds();

        const payload =
            JSON.stringify({
                sessionId,
                activeSeconds
            });

        if (
            navigator.sendBeacon
        ) {
            const blob =
                new Blob(
                    [payload],
                    {
                        type:
                            "application/json"
                    }
                );

            const sent =
                navigator.sendBeacon(
                    END_ENDPOINT,
                    blob
                );

            if (sent) {
                return;
            }
        }

        fetch(
            END_ENDPOINT,
            {
                method: "POST",

                credentials:
                    "include",

                keepalive: true,

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    payload
            }
        ).catch(
            function () {}
        );
    }

    document.addEventListener(
        "visibilitychange",
        function () {
            if (
                document.visibilityState ===
                "visible"
            ) {
                startActiveClock();
            } else {
                stopActiveClock();

                sendHeartbeat();
            }
        }
    );

    window.addEventListener(
        "focus",
        startActiveClock
    );

    window.addEventListener(
        "blur",
        function () {
            stopActiveClock();

            sendHeartbeat();
        }
    );

    window.addEventListener(
        "pagehide",
        endSession
    );

    startSession();
})();
</script>
